[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iris-regression-multiagent"
version = "0.1.0"
description = "Multi-framework (LangGraph, AutoGen, CrewAI) Iris linear regression demo for AgentProbe benchmarking"
authors = [{ name = "Chhayank Jain" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "agentprobe",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
]
autogen = [
    "ag2>=0.7.0",
]
crewai = [
    "crewai>=0.80.0",
    "crewai-tools>=0.17.0",
]
ollama = ["langchain-ollama>=0.2.0"]
openai = ["langchain-openai>=0.2.0"]
anthropic = ["langchain-anthropic>=0.2.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.12.0",
]
all = [
    "iris-regression-multiagent[langgraph,autogen,crewai,ollama,openai,anthropic,dev]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
