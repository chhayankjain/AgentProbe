[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentprobe-toolkit"
version = "1.2.0"
description = "Fault injection and OpenTelemetry observability toolkit for evaluating the reliability of LLM agents (LangGraph, LangChain, AutoGen)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Chhayank Jain" },
    { name = "Sarthak Pattnaik" },
    { name = "Eugene Pinsky" },
]
maintainers = [{ name = "Chhayank Jain" }]
keywords = [
    "llm", "agents", "reliability", "observability", "benchmarking", "fault-injection",
    "chaos-engineering", "opentelemetry", "langgraph", "langchain", "autogen",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    # The LangChain adapter uses ``langchain.agents.create_agent`` (LangChain 1.x).
    "langgraph>=1.0.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "prometheus-client>=0.21.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.10.0",
]
plotting = [
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
]
ollama = [
    "langchain-ollama>=0.2.0",
]
openai = [
    "langchain-openai>=0.2.0",
]
anthropic = [
    "langchain-anthropic>=0.2.0",
]
# The AutoGen adapter targets the legacy pyautogen 0.1.14 API, which requires the
# pre-1.0 openai client. This extra conflicts with ``langchain-openai`` (needs
# openai>=1); install it in a separate environment.
autogen = [
    "pyautogen==0.1.14",
    "openai<1.0",
]

[project.urls]
Homepage = "https://github.com/chhayankjain/AgentProbe"
Repository = "https://github.com/chhayankjain/AgentProbe"
Issues = "https://github.com/chhayankjain/AgentProbe/issues"
Changelog = "https://github.com/chhayankjain/AgentProbe/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/chhayankjain/AgentProbe/issues/38"

# The distribution is ``agentprobe-toolkit`` (``agentprobe`` was already taken on PyPI);
# the import name stays ``agentprobe``. Hatchling must be told explicitly, since it
# would otherwise look for an ``agentprobe_toolkit`` package.
[tool.hatch.build.targets.wheel]
packages = ["agentprobe"]

[tool.hatch.build.targets.sdist]
only-include = [
    "agentprobe",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CITATION.cff",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring live LLM APIs",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = [
    "N806",   # variable in function should be lowercase (used for constant-like arrays)
    "N818",   # exception name should end with Error (internal naming convention)
    "E731",   # lambda assignment (used in metrics helper)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # allow long lines in tests

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
