name: Docs

# The docs site lives on Cloudflare Pages: https://agentprobe-toolkit.pages.dev/
# Pull requests only build it (strict, so broken links fail). A push to main
# deploys it, and replaces the old GitHub Pages site with redirects to the new
# address. Running the workflow by hand on another branch deploys a Cloudflare
# preview for that branch (production is untouched).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
      - ".github/scripts/pages_redirects.py"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
      - ".github/scripts/pages_redirects.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PROJECT: agentprobe-toolkit
  DOCS_URL: https://agentprobe-toolkit.pages.dev/
  WRANGLER: wrangler@4.156.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build (strict, so broken links and warnings fail)
        run: mkdocs build --strict
      - name: Build redirects for the old GitHub Pages address
        run: python .github/scripts/pages_redirects.py site redirects "$DOCS_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirects

  cloudflare:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'docs-production' || 'docs-preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create the Pages project (first run only)
        run: |
          npx --yes "$WRANGLER" pages project list | grep -qw "$CLOUDFLARE_PROJECT" \
            || npx --yes "$WRANGLER" pages project create "$CLOUDFLARE_PROJECT" --production-branch main
      - name: Deploy
        id: deploy
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          npx --yes "$WRANGLER" pages deploy site \
            --project-name "$CLOUDFLARE_PROJECT" --branch "$branch" --commit-dirty=true | tee deploy.log
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "url=$DOCS_URL" >> "$GITHUB_OUTPUT"
          else
            echo "url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1)" >> "$GITHUB_OUTPUT"
          fi

  github-pages-redirects:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: cloudflare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
