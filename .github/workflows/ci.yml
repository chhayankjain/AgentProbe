name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plotting]" langchain-openai

      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not slow and not integration"

      - name: Run the own-agent example and tutorial tests
        run: pytest examples/your_agent -v --tb=short --junitxml=agentprobe-example.xml

      - name: Check the real-model example offline (live tests need Ollama and are skipped)
        run: |
          python -m py_compile examples/real_model_agent/*.py examples/third_party_agent/*.py
          pytest examples/real_model_agent -v --tb=short -m "not slow and not integration"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check agentprobe/ tests/ examples/

      - name: Ruff format check
        run: ruff format --check agentprobe/ tests/ examples/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plotting]"

      - name: Run mypy
        continue-on-error: true  # advisory until pre-existing type errors are resolved
        run: mypy agentprobe/ --ignore-missing-imports

  build:
    name: Package build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata and README rendering
        run: twine check --strict dist/*

      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          from importlib.resources import files
          import agentprobe
          from agentprobe import ToolFailureInjector, AgentProbeTracer
          from agentprobe.testing import probe
          assert files("agentprobe").joinpath("py.typed").is_file()
          print("agentprobe", agentprobe.__version__)
          PY
          /tmp/smoke/bin/python -m agentprobe.demo --runs 2 --p 0

  sdist-tests:
    name: Test suite from the source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Extract, install, and run the bundled tests
        run: |
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist
          test -f docs/instrumentation.md
          test -f CONTRIBUTING.md
          pip install ".[dev,plotting]" langchain-openai
          pytest tests/ -q -m "not slow and not integration"
          pytest examples/your_agent -q
