name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plotting]" langchain-openai

      - name: Run tests
        run: pytest tests/ -v --tb=short -m "not slow and not integration"

      - name: Run the own-agent example and tutorial tests
        run: pytest examples/your_agent -v --tb=short --junitxml=agentprobe-example.xml

      - name: Check the real-model and third-party examples offline (live tests are skipped)
        run: |
          python -m py_compile examples/real_model_agent/*.py examples/third_party_agent/*.py
          pytest examples/real_model_agent examples/third_party_agent -v --tb=short -m "not slow and not integration"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check agentprobe/ tests/ examples/

      - name: Ruff format check
        run: ruff format --check agentprobe/ tests/ examples/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plotting]"

      - name: Run mypy (strict, blocking)
        # tests/test_public_types.py checks the types users see (assert_type)
        run: mypy agentprobe/ tests/test_public_types.py

  build:
    name: Package build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata and README rendering
        run: twine check --strict dist/*

      - name: Smoke-test the wheel (no extras, each extra, [research]) in clean venvs
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install --quiet dist/*.whl pytest
          /tmp/core/bin/python - <<'PY'
          import sys
          from importlib.resources import files
          import agentprobe
          from agentprobe.testing import probe
          assert files("agentprobe").joinpath("py.typed").is_file()
          optional = {"langchain", "langchain_core", "langgraph", "opentelemetry", "grpc",
                      "prometheus_client", "pydantic", "rich", "numpy", "scipy"}
          loaded = optional & {m.split(".")[0] for m in sys.modules}
          assert not loaded, f"core install imported optional packages: {loaded}"
          print("core install OK:", agentprobe.__version__)
          PY
          (cd examples/your_agent && /tmp/core/bin/python -m pytest -q -p no:cacheprovider)
          python -m venv /tmp/langchain
          /tmp/langchain/bin/pip install --quiet "$(ls dist/*.whl)[langchain]"
          /tmp/langchain/bin/python -c "from agentprobe.fake_llm import ScriptedToolCallingModel; from agentprobe.testing import probe"
          /tmp/langchain/bin/python -c "import agentprobe.agents.langgraph_agent" 2>&1 | grep -q 'agentprobe-toolkit\[research\]'
          python -m venv /tmp/observability
          /tmp/observability/bin/pip install --quiet "$(ls dist/*.whl)[observability]"
          /tmp/observability/bin/python -c "from agentprobe import AgentProbeTracer, ToolFailureInjector, FailureClassifier; AgentProbeTracer(console=False)"
          /tmp/observability/bin/python -c "import agentprobe; agentprobe.BenchmarkRunner" 2>&1 | grep -q 'agentprobe-toolkit\[research\]'
          python -m venv /tmp/research
          /tmp/research/bin/pip install --quiet "$(ls dist/*.whl)[research]"
          /tmp/research/bin/python -c "from agentprobe import ToolFailureInjector, AgentProbeTracer, BenchmarkRunner"
          /tmp/research/bin/python -m agentprobe.demo --runs 2 --p 0

  sdist-tests:
    name: Test suite from the source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Extract, install, and run the bundled tests
        run: |
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist
          test -f docs/instrumentation.md
          test -f CONTRIBUTING.md
          pip install ".[dev,plotting]" langchain-openai
          pytest tests/ -q -m "not slow and not integration"
          pytest examples/your_agent -q
