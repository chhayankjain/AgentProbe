name: Release

# Publishes the ``agentprobe-toolkit`` distribution.
#
#   * Pushing a tag ``vX.Y.Z``  -> build, verify tag == pyproject version, publish to PyPI,
#                                  then create the GitHub release with the built files attached.
#   * Manual "Run workflow"     -> build and publish to TestPyPI (dry run; nothing reaches PyPI).
#
# Both publish jobs use PyPI Trusted Publishing (OIDC). No API tokens are stored in the repo.
# One-time setup is described in RELEASE.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Check metadata and README rendering
        run: twine check --strict dist/*

      - name: Smoke-test the wheel (no extras, then [research]) in clean venvs
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install --quiet dist/*.whl pytest
          /tmp/core/bin/python - <<'PY'
          import sys
          from importlib.resources import files
          import agentprobe
          from agentprobe.testing import probe
          assert files("agentprobe").joinpath("py.typed").is_file()
          optional = {"langchain", "langchain_core", "langgraph", "opentelemetry", "grpc",
                      "prometheus_client", "pydantic", "rich", "numpy", "scipy"}
          loaded = optional & {m.split(".")[0] for m in sys.modules}
          assert not loaded, f"core install imported optional packages: {loaded}"
          print("core install OK:", agentprobe.__version__)
          PY
          (cd examples/your_agent && /tmp/core/bin/python -m pytest -q -p no:cacheprovider)
          python -m venv /tmp/research
          /tmp/research/bin/pip install --quiet "$(ls dist/*.whl)[research]"
          /tmp/research/bin/python -c "from agentprobe import ToolFailureInjector, AgentProbeTracer, BenchmarkRunner"
          /tmp/research/bin/python -m agentprobe.demo --runs 2 --p 0

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI (manual dry run)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/agentprobe-toolkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentprobe-toolkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
